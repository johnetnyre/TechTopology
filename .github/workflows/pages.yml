name: Build, test, and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install site builder
        run: pip install -r requirements.txt

      - name: Build site
        env:
          SITE_BASEURL: ${{ steps.pages.outputs.base_path }}
        run: python scripts/build.py

      - name: Run structural HTML checks
        run: python scripts/check_html.py

      - name: Start local preview for accessibility testing
        run: python -m http.server 8000 --directory _site >/tmp/tech-topology-http.log 2>&1 &

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run WCAG 2 AA automated checks
        run: npx --yes pa11y-ci@4.1.1 --config .pa11yci.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
