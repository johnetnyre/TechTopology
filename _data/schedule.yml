  - speaker: "Luya Wang"
    title: "Complements of submanifolds in 4-dimensional Weinstein domains"
    abstract: |
      I will introduce the notion of nearly Lefschetz fibrations, which can be viewed as the complements of neighborhoods of 
      positive multisections in bordered Lefschetz fibrations. We show that these objects are supported by canonical 
      Stein/Weinstein structures and provide a tool to understand Lagrangian submanifolds in Weinstein domains. In particular, 
      we show that in 4-dimensional Weinstein domains, up to deformation, all Lagrangian disks with Legendrian boundaries are 
      regular, in the sense of Eliashberg-Ganatra-Lazarev. This is joint work with Agniva Roy and Joseph Breen.

