  - speaker: "Mark Hughes"
    title: "A knotted projective plane that can't be reduced"
    abstract: |
      One way to construct a knotted projective plane in the 4-sphere is to take the connected sum of a standard projective 
      plane with a knotted 2-sphere. A longstanding conjecture of Kinoshita asserts that every knotted projective plane can 
      be obtained in this way. I will describe a counterexample, constructed from a classical knot and a braid, and explain 
      how the peripheral subgroup of its complement provides an obstruction to this decomposition. The construction also 
      yields a knotted Klein bottle answering a related question. The talk will discuss the geometry of the construction and 
      the main ideas of the proof. This is joint work with Seungwon Kim, Maggie Miller, and Gheehyun Nahm.          

