  - speaker: "Mark Hughes"
    title: "A knotted projective plane that can't be reduced"
    abstract: |
      One way to construct a knotted projective plane in the 4-sphere is to take the connected sum of a standard projective 
      plane with a knotted 2-sphere. A longstanding conjecture of Kinoshita asserts that every knotted projective plane can 
      be obtained in this way. I will describe a counterexample, constructed from a classical knot and a braid, and explain 
      how the peripheral subgroup of its complement provides an obstruction to this decomposition. The construction also 
      yields a knotted Klein bottle answering a related question. The talk will discuss the geometry of the construction and 
      the main ideas of the proof. This is joint work with Seungwon Kim, Maggie Miller, and Gheehyun Nahm.          

  - speaker: "Isabella Kahn"
    title: "TBA"
    abstract: |
      TBA
      
  - speaker: "Adam Levine"
    title: "Knot Floer homology, bordered Floer homology, surgery modules, and immersed curves"
    abstract: |
      This talk will explore the relationship between several different versions of bordered Heegaard Floer homology for 
      3-manifolds with torus boundary. I will begin by describing the original Ozsváth-Szabó knot surgery formula and 
      its reinterpretation by Zemke as a new (and very powerful) version of bordered Floer homology. I will then show how 
      this theory can recover the original Lipshitz-Ozsváth-Thurston bordered theory, which can be explained very cleanly 
      in terms of immersed curves. This is joint work with Ian Zemke and Jonathan Hanselman.      

  - speaker: "Ian Sullivan"
    title: "TBA"
    abstract: |
      TBA
      
  - speaker: "Luya Wang"
    title: "Complements of submanifolds in 4-dimensional Weinstein domains"
    abstract: |
      I will introduce the notion of nearly Lefschetz fibrations, which can be viewed as the complements of neighborhoods of 
      positive multisections in bordered Lefschetz fibrations. We show that these objects are supported by canonical 
      Stein/Weinstein structures and provide a tool to understand Lagrangian submanifolds in Weinstein domains. In particular, 
      we show that in 4-dimensional Weinstein domains, up to deformation, all Lagrangian disks with Legendrian boundaries are 
      regular, in the sense of Eliashberg-Ganatra-Lazarev. This is joint work with Agniva Roy and Joseph Breen.

