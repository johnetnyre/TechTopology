{% extends '_templates/base.html' %}
{% block content %}
<div class="shell page-shell">
  <article class="content-card">
    <header class="page-header">
      {% if kicker %}<p class="section-kicker">{{ kicker }}</p>{% endif %}
      <h1>{{ page_title }}</h1>
      {% if intro %}<p class="lede">{{ intro }}</p>{% endif %}
    </header>
    {{ body|safe }}
  </article>
</div>
{% endblock %}
