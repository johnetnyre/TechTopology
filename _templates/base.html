<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ meta_description|e }}">
  <meta name="theme-color" content="#051E39">
  <title>{{ page_title|e }} · {{ conference.site_title|e }}</title>
  <link rel="stylesheet" href="{{ url('/assets/css/site.css') }}">
  <script src="{{ url('/assets/js/site.js') }}" defer></script>
</head>
<body class="page-{{ page_slug|e }}">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {% include '_templates/header.html' %}
  <main id="main-content" class="site-main" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  {% include '_templates/footer.html' %}
</body>
</html>
